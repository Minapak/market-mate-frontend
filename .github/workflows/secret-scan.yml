name: Secret Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # 매주 월요일 03:00 UTC - 신규 탐지 룰 반영용

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (전체 히스토리)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 전체 히스토리 - 이게 없으면 최신 커밋만 검사됨

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false   # 리포트에 시크릿이 담기므로 업로드 금지
